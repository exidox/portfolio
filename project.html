<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090F1F;
  --bone:#E7EDFF;
  --bone-dim:rgba(196,210,241,.62);
  --mint:#91B8FF;
  --mint-dim:rgba(113,151,235,.42);
  --lavender:#B4A7FF;
  --border:rgba(145,169,220,.15);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--bone);font-family:'Inter',sans-serif;min-height:100vh;cursor:none}
#cursor-dot,#cursor-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
#cursor-dot{width:5px;height:5px;background:var(--bone);transition:transform .1s ease}
#cursor-ring{width:28px;height:28px;border:1px solid rgba(196,210,241,.58);transition:transform .12s ease,width .2s ease,height .2s ease,opacity .2s ease}
a,button{cursor:none}
a:hover~#cursor-ring,button:hover~#cursor-ring{width:40px;height:40px}
.project-nav{
 position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
 padding:1.2rem 3rem;background:rgba(9,15,31,.93);backdrop-filter:blur(12px);
 border-bottom:1px solid var(--border)
}
.nav-back{display:flex;align-items:center;gap:.6rem;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.15em;color:var(--bone-dim);text-decoration:none;text-transform:uppercase;transition:color .2s ease}
.nav-back:hover{color:#B9C9FF}
.nav-back .arrow{font-size:14px}
.nav-id,.nav-name{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.nav-id{color:var(--lavender)}
.nav-name{letter-spacing:.15em;color:var(--bone-dim)}
.project-hero{width:100%;height:clamp(340px,55vh,620px);overflow:hidden;position:relative}
.project-hero img,.project-hero video{width:100%;height:100%;object-fit:cover;display:block}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(9,15,31,.78) 100%)}
.project-content{max-width:1100px;margin:0 auto;padding:3.5rem 3rem 6rem}
.project-meta{display:flex;align-items:baseline;gap:1.2rem;margin-bottom:1rem}
.meta-num,.meta-year,.meta-category{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.meta-num{letter-spacing:.25em;color:var(--lavender)}
.meta-year{color:var(--bone-dim)}
.meta-category{letter-spacing:.15em;color:var(--mint)}
.project-title{font-family:'Instrument Serif',serif;font-size:clamp(2.2rem,5vw,4rem);line-height:1.05;color:var(--bone);margin-bottom:1.8rem}
.project-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem}
.project-tag{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:.3rem .7rem;border:1px solid var(--mint-dim);color:var(--mint)}
.project-desc{font-size:16px;line-height:1.75;color:var(--bone-dim);max-width:680px;margin-bottom:4rem}
.presentation-section{margin:0 0 5rem}
.presentation-label,.gallery-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:1.2rem;display:flex;align-items:center;gap:.8rem}
.presentation-label::after,.gallery-label::after{content:'';flex:1;height:1px;background:var(--border)}
.presentation-stack{display:flex;flex-direction:column;gap:0;width:100%}
.presentation-stack img{display:block;width:100%;height:auto;object-fit:contain;background:#090F1F}
.presentation-stack video{display:block;width:100%;max-height:85vh;height:auto;background:#070B16;object-fit:contain}
.presentation-stack video+img,.presentation-stack img+video{margin-top:0}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:3px}
.gallery-item{aspect-ratio:4/3;overflow:hidden;position:relative;border:1px solid var(--border);cursor:none}
.gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.gallery-item:hover img,.gallery-item:hover video{transform:scale(1.04)}
.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(5,9,20,.97);align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox-img,.lightbox-video{max-width:90vw;max-height:90vh;width:auto;height:auto;object-fit:contain}
.lightbox-video{display:none}
.lightbox-close{position:absolute;top:1.5rem;right:2rem;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--bone-dim);background:none;border:none;cursor:none;text-transform:uppercase}
.lightbox-close:hover{color:#C3B8FF}
.project-nav-arrows{display:flex;gap:1rem;margin-top:5rem;border-top:1px solid var(--border);padding-top:2rem}
.nav-arrow-btn{display:flex;align-items:center;gap:.6rem;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--bone-dim);text-decoration:none;transition:color .2s ease}
.nav-arrow-btn:hover{color:#B9C9FF}
.nav-arrow-btn.next{margin-left:auto}
@media(max-width:640px){
 .project-nav{padding:1rem 1.2rem}
 .project-content{padding:2rem 1.2rem 4rem}
}
</style>

function isVideo(src){return /\.(mp4|webm|ogg)(\?|$)/i.test(src)}

function renderPresentation(project){
 const section=document.getElementById('presentation-section');
 const container=document.getElementById('presentation');
 const media=Array.isArray(project.presentation)?project.presentation:[];
 container.innerHTML='';
 if(!media.length){section.hidden=true;return}
 section.hidden=false;
 media.forEach(function(src,i){
  if(isVideo(src)){
   const video=document.createElement('video');
   video.src=src;video.controls=true;video.playsInline=true;video.preload='metadata';
   video.setAttribute('aria-label',project.title+' presentation video');
   container.appendChild(video);
  }else{
   const img=document.createElement('img');
   img.src=src;img.alt=project.title+' presentation slide '+(i+1);
   img.loading='lazy';container.appendChild(img);
  }
 });
}

function render(project,idx){
 document.title=project.title+' — Shubham Bhatt';
 document.getElementById('nav-id').textContent=project.num+' — '+project.year;
 document.getElementById('meta-num').textContent=project.num;
 document.getElementById('meta-year').textContent=project.year;
 document.getElementById('meta-cat').textContent='· '+project.category;
 document.getElementById('proj-title').textContent=project.title;
 document.getElementById('proj-desc').textContent=project.desc;

 renderPresentation(project);

 const heroImg=document.getElementById('hero-img');
 heroImg.src=project.images[0];heroImg.alt=project.title;

 document.getElementById('proj-tags').innerHTML=project.tags.map(t=>'<span class="project-tag">'+t+'</span>').join('');

 const gallery=document.getElementById('gallery');
 gallery.innerHTML=project.images.map(function(src,i){
  if(isVideo(src)){
   return '<div class="gallery-item" data-src="'+src+'" data-type="video">'+
   '<video src="'+src+'" muted loop autoplay playsinline preload="metadata"></video>'+
   '<div class="gallery-video-indicator">Video · Tap to open</div></div>';
  }
  return '<div class="gallery-item" data-src="'+src+'" data-type="image">'+
  '<img src="'+src+'" alt="'+project.title+' '+(i+1)+'" loading="lazy"></div>';
 }).join('');

 gallery.querySelectorAll('.gallery-item').forEach(function(item){
  item.addEventListener('click',function(){
   const src=item.dataset.src,type=item.dataset.type;
   const lightbox=document.getElementById('lightbox');
   const lbImg=document.getElementById('lb-img');
   const lbVideo=document.getElementById('lb-video');

   if(type==='video'){
    lbImg.style.display='none';lbImg.removeAttribute('src');
    lbVideo.style.display='block';lbVideo.src=src;lbVideo.currentTime=0;
    lbVideo.load();lightbox.classList.add('open');
    lbVideo.play().catch(function(){});
   }else{
    lbVideo.pause();lbVideo.removeAttribute('src');lbVideo.load();
    lbVideo.style.display='none';lbImg.style.display='block';
    lbImg.src=src;lightbox.classList.add('open');
   }
  });
 });

 const total=PROJECTS.length;
 const prevIdx=(idx-1+total)%total;
 const nextIdx=(idx+1)%total;
 document.getElementById('btn-prev').href='project.html?id='+(prevIdx+1);
 document.getElementById('btn-next').href='project.html?id='+(nextIdx+1);
 document.getElementById('btn-prev').innerHTML='← '+PROJECTS[prevIdx].num+' '+PROJECTS[prevIdx].title;
 document.getElementById('btn-next').innerHTML=PROJECTS[nextIdx].num+' '+PROJECTS[nextIdx].title+' →';
}

const params=new URLSearchParams(window.location.search);
let id=parseInt(params.get('id'),10)||1;
id=Math.min(Math.max(id,1),PROJECTS.length);
render(PROJECTS[id-1],id-1);

document.getElementById('lb-close').addEventListener('click',function(){

});
document.getElementById('lightbox').addEventListener('click',function(e){

});

const dot=document.getElementById('cursor-dot');
const ring=document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY});
(function loop(){
 dot.style.left=mx+'px';dot.style.top=my+'px';
 rx+=(mx-rx)*.15;ry+=(my-ry)*.15;
 ring.style.left=rx+'px';ring.style.top=ry+'px';
 requestAnimationFrame(loop);
})();
